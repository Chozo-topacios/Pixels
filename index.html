<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixel Agents</title>
<meta name="description" content="Un equipo de agentes pixel-art defendiendo sus servidores en pleno ataque de ciberseguridad.">
<meta name="theme-color" content="#0b1020">
<style>
:root { --bg: #0b1020; --card: #121a30; --ink: #e6f1ff; --muted: #8fa3c7; --line: #22304f; --ok: #22c55e; --bad: #ef4444; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
main { max-width: 900px; margin: 0 auto; padding: 24px 16px 40px; }
h1 { margin: 0 0 4px; font-size: clamp(26px, 6vw, 40px); letter-spacing: .5px; }
.sub { margin: 0 0 20px; color: var(--muted); font-weight: 600; }
.card { background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 16px; transition: border-color .2s; }
.card.alarm { border-color: var(--bad); }
.soc-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.soc-head h2 { margin: 0; font-size: 20px; }
.muted { color: var(--muted); font-size: 14px; font-weight: 700; }
canvas { display: block; width: 100%; height: auto; aspect-ratio: 176 / 72; image-rendering: pixelated; image-rendering: crisp-edges; border-radius: 12px; background: #0b1020; cursor: crosshair; }
.stats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.pill { background: #0b1020; border: 2px solid var(--line); border-radius: 999px; padding: 6px 12px; font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; }
.pill.lvl-bajo { color: var(--ok); } .pill.lvl-medio { color: #fbbf24; } .pill.lvl-alto { color: var(--bad); }
.list { display: grid; gap: 8px; margin-top: 14px; }
.row { display: flex; align-items: center; gap: 10px; font-size: 16px; min-width: 0; }
.row b { white-space: nowrap; }
.job { color: var(--muted); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 10px; height: 10px; border-radius: 2px; flex: none; opacity: .35; }
.row.busy .dot { opacity: 1; animation: pulse 1s infinite; }
@keyframes pulse { 50% { transform: scale(1.4); } }
.controls { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
button.btn { border: none; border-radius: 14px; padding: 12px 18px; font: inherit; font-weight: 800; background: #16a34a; color: #fff; box-shadow: 0 4px 0 #0f7a36; cursor: pointer; }
button.btn.red { background: #dc2626; box-shadow: 0 4px 0 #991b1b; }
button.btn:active { transform: translateY(3px); box-shadow: none; }
button.btn.ghost { background: transparent; color: var(--ink); border: 2px solid var(--line); box-shadow: none; }
@media (prefers-reduced-motion: reduce) { .row.busy .dot { animation: none; } }
</style>
</head>
<body>
<main>
  <h1>👾 Pixel Agents</h1>
  <p class="sub">Un equipo de ciberseguridad pixel-art defiende sus servidores en pleno ataque. Toca a un agente para que dispare.</p>
  <div class="card" id="card">
    <div class="soc-head"><h2>🚨 Centro de operaciones de seguridad</h2><span class="muted">¡Toca a un agente!</span></div>
    <canvas id="cv" width="176" height="72" role="img" aria-label="Agentes pixel defendiendo los servidores de un ataque informático"></canvas>
    <div class="stats">
      <span class="pill" id="sBlock">🛡️ Bloqueados: 0</span>
      <span class="pill" id="sBreach">💥 Brechas: 0</span>
      <span class="pill lvl-bajo" id="sLevel">Amenaza: baja</span>
    </div>
    <div class="list" id="list"></div>
  </div>
  <div class="controls">
    <button class="btn" id="counter">🛡️ Contraataque</button>
    <button class="btn red" id="wave">🚨 Nueva oleada</button>
    <button class="btn ghost" id="cheer">👏 Bien hecho</button>
    <button class="btn ghost" id="snd">🔊 Sonido: sí</button>
  </div>
</main>
<script>
'use strict';
const rand = Math.random, rnd = n => Math.floor(rand() * n), pick = a => a[rnd(a.length)];
let sound = true, actx = null;
function audio() {
  if (!actx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; actx = new C(); }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function beep(f1, f2, when, dur, vol, type = 'square') {
  if (!sound) return;
  const c = audio(); if (!c) return;
  const t = c.currentTime + when, g = c.createGain(), o = c.createOscillator();
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
}
const sfx = {
  zap: () => beep(1400, 220, 0, .12, .05),
  pop: () => beep(300, 60, 0, .15, .06, 'sawtooth'),
  breach: () => { beep(160, 90, 0, .35, .12, 'sawtooth'); },
  alarm: () => { for (let i = 0; i < 3; i++) { beep(880, 880, i * .4, .18, .08); beep(620, 620, i * .4 + .2, .18, .08); } },
  win: () => [523, 659, 784, 1046].forEach((f, i) => beep(f, f, i * .1, .25, .08, 'triangle')),
  ok: () => { beep(880, 880, 0, .12, .07, 'sine'); beep(1318, 1318, .08, .2, .07, 'sine'); },
};

// ---------- Agentes ----------
const AGENTS = [
  { name: 'Ana', icon: '🛡️', gear: 'headset', hair: '#3b2a1a', skin: '#f5c9a0', shirt: '#2563eb', beam: '#38bdf8',
    jobs: ['Bloqueando la IP 203.0.113.7', 'Cerrando puertos abiertos', 'Actualizando reglas del firewall', 'Frenando un ataque DDoS'] },
  { name: 'Beto', icon: '🔍', gear: 'glasses', hair: '#e2683c', skin: '#e0a878', shirt: '#16a34a', beam: '#4ade80',
    jobs: ['Analizando el malware', 'Revisando registros sospechosos', 'Rastreando al intruso', 'Aislando el virus en una caja de arena'] },
  { name: 'Cami', icon: '💾', gear: 'cap', hair: '#1f1b2e', skin: '#c68a5e', shirt: '#9333ea', beam: '#c084fc',
    jobs: ['Restaurando copias de seguridad', 'Parcheando los servidores', 'Cambiando contraseñas', 'Verificando que todo funcione'] },
  { name: 'Dani', icon: '📡', gear: 'hood', hair: '#f4c542', skin: '#f2d1b3', shirt: '#475569', beam: '#facc15',
    jobs: ['Aislando el equipo infectado', 'Avisando al equipo de guardia', 'Coordinando la defensa', 'Escribiendo el informe del incidente'] },
];
const W = 176, H = 72, FLOOR = 56, RACK_X = 14;
const cv = document.getElementById('cv'), g = cv.getContext('2d');
const card = document.getElementById('card');
const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const slots = AGENTS.map((a, i) => ({ ...a, cx: 34 + i * 36, busy: true, job: 0, jump: -1e9, sad: 0, blink: rnd(4000), cool: 0 }));
let bugs = [], sparks = [], beams = [], blocked = 0, breaches = 0, alarm = 0, frenzy = 0, nextSpawn = 0;
const r = (x, y, w, hh, c) => { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), w, hh); };
function line(x1, y1, x2, y2, c) {
  const n = Math.max(Math.abs(x2 - x1), Math.abs(y2 - y1)) | 0;
  for (let i = 0; i <= n; i++) r(x1 + (x2 - x1) * i / n, y1 + (y2 - y1) * i / n, 1, 1, c);
}
function spawn(n = 1) {
  for (let k = 0; k < n; k++) bugs.push({ x: W + 4 + k * 9, y: 8 + rnd(34), vx: -(0.18 + rand() * 0.2), ph: rand() * 6, kind: rnd(3) });
}

function scene(t) {
  r(0, 0, W, FLOOR, '#111a33');
  for (let x = 0; x < W; x += 8) r(x, 0, 1, FLOOR, '#141f3b');
  // pantalla gigante con el mapa de amenazas
  r(46, 4, 84, 26, '#0a2a1f'); r(47, 5, 82, 24, '#052016');
  for (let x = 51; x < 129; x += 8) r(x, 5, 1, 24, '#0b3324');
  for (let y = 9; y < 29; y += 6) r(47, y, 82, 1, '#0b3324');
  [[55, 11, 10, 5], [70, 9, 14, 7], [88, 14, 8, 6], [100, 9, 16, 8], [112, 19, 8, 5], [62, 20, 7, 5]].forEach(([x, y, w, hh]) => r(x, y, w, hh, '#14532d'));
  for (let i = 0; i < 5; i++) { const on = (Math.floor(t / 250) + i * 3) % 5 < 2; if (on) r(56 + i * 15, 12 + (i * 7) % 12, 2, 2, '#ef4444'); }
  const lvl = Math.min(1, bugs.length / 10);
  r(48, 27, 80, 1, '#0b3324'); r(48, 27, Math.max(2, Math.round(80 * lvl)), 1, lvl > .6 ? '#ef4444' : lvl > .3 ? '#fbbf24' : '#22c55e');
  // sirena
  const siren = t < alarm && Math.floor(t / 150) % 2;
  r(150, 0, 8, 2, '#374151'); r(151, 2, 6, 3, siren ? '#ff3b3b' : '#5b1a1a');
  if (siren) { r(146, 3, 3, 1, '#ff3b3b'); r(159, 3, 3, 1, '#ff3b3b'); }
  // rack de servidores (lo que hay que proteger)
  const hit = t < alarm && Math.floor(t / 100) % 2;
  r(2, 14, 12, FLOOR - 14, hit ? '#7f1d1d' : '#1f2937'); r(3, 15, 10, FLOOR - 16, '#0f172a');
  for (let y = 17; y < FLOOR - 2; y += 5) {
    r(4, y, 8, 3, '#1e293b');
    r(5, y + 1, 1, 1, (Math.floor(t / 90) + y) % 4 ? '#22c55e' : '#0f3d22');
    r(7, y + 1, 1, 1, (Math.floor(t / 130) + y) % 3 ? '#38bdf8' : '#0c3550');
    r(10, y + 1, 1, 1, hit ? '#ef4444' : '#334155');
  }
  // escudo/firewall delante del rack
  const sh = 0.35 + 0.25 * Math.sin(t / 200);
  g.globalAlpha = sh; r(RACK_X + 2, 10, 1, FLOOR - 10, '#38bdf8'); g.globalAlpha = 1;
  // piso
  r(0, FLOOR, W, H - FLOOR, '#1e293b');
  for (let x = 0; x < W; x += 12) r(x, FLOOR, 1, H - FLOOR, '#172033');
  r(0, FLOOR, W, 1, '#0f172a');
  for (let x = 20; x < W; x += 16) r(x, FLOOR + 9, 8, 1, '#0b1222');
}

function agent(s, t, dt) {
  const b = FLOOR + 2, x = s.cx;
  const jp = (t - s.jump) / 450;
  const dy = jp >= 0 && jp < 1 ? -Math.round(Math.sin(Math.PI * jp) * 7) : 0;
  const sad = t < s.sad, active = (s.busy || t < frenzy) && !sad;
  const f = active ? Math.floor(t / 110 + x) % 2 : 0;
  const blink = (t + s.blink) % 4000 < 140;
  // silla
  r(x - 5, b - 9, 10, 1, '#0f172a'); r(x - 1, b - 8, 2, 6, '#0f172a'); r(x - 4, b - 2, 8, 1, '#0f172a');
  // cuerpo
  r(x - 4, b - 11 + dy, 8, 7, s.shirt);
  r(x - 3, b - 17 + dy, 6, 6, s.skin);
  if (s.gear === 'hood') { r(x - 4, b - 18 + dy, 8, 2, s.shirt); r(x - 4, b - 17 + dy, 1, 5, s.shirt); r(x + 3, b - 17 + dy, 1, 5, s.shirt); r(x - 2, b - 18 + dy, 4, 1, s.hair); }
  else { r(x - 3, b - 18 + dy, 6, 2, s.hair); r(x - 4, b - 17 + dy, 1, 3, s.hair); r(x + 3, b - 17 + dy, 1, 3, s.hair); }
  if (s.gear === 'cap') { r(x - 4, b - 19 + dy, 8, 2, '#f97316'); r(x + 3, b - 18 + dy, 3, 1, '#f97316'); }
  if (sad) { r(x - 2, b - 15 + dy, 1, 1, '#0b1020'); r(x + 1, b - 15 + dy, 1, 1, '#0b1020'); r(x + 4, b - 18 + dy + (Math.floor(t / 300) % 2), 1, 2, '#7dd3fc'); }
  else if (!blink) { r(x - 2, b - 15 + dy, 1, 2, '#0b1020'); r(x + 1, b - 15 + dy, 1, 2, '#0b1020'); }
  else { r(x - 2, b - 14 + dy, 1, 1, '#0b1020'); r(x + 1, b - 14 + dy, 1, 1, '#0b1020'); }
  if (s.gear === 'glasses') { r(x - 3, b - 15 + dy, 6, 1, '#111827'); r(x - 2, b - 15 + dy, 1, 1, '#93c5fd'); r(x + 1, b - 15 + dy, 1, 1, '#93c5fd'); }
  if (s.gear === 'headset') { r(x - 4, b - 19 + dy, 8, 1, '#111827'); r(x - 5, b - 16 + dy, 2, 3, '#111827'); r(x + 3, b - 16 + dy, 2, 3, '#111827'); r(x - 4, b - 13 + dy, 3, 1, '#111827'); }
  // brillo de la pantalla en la cara
  if (active) { g.globalAlpha = .25; r(x - 3, b - 13 + dy, 6, 2, s.beam); g.globalAlpha = 1; }
  // escritorio y laptop (vista de espaldas)
  r(x - 10, b - 8, 20, 2, '#334155'); r(x - 9, b - 6, 1, 6, '#1e293b'); r(x + 8, b - 6, 1, 6, '#1e293b');
  r(x - 5, b - 13, 10, 5, '#9ca3af'); r(x - 4, b - 12, 8, 3, '#cbd5e1'); r(x - 1, b - 11, 2, 1, s.beam);
  // manos tecleando
  r(x - 7, b - 10 - (f ? 1 : 0), 2, 2, s.skin); r(x + 5, b - 10 - (f ? 0 : 1), 2, 2, s.skin);
  // taza de café
  if (s.gear === 'cap' || s.gear === 'glasses') { r(x + 6, b - 11, 2, 3, '#f8fafc'); r(x + 8, b - 10, 1, 1, '#f8fafc'); }
  if (!active && !sad) {
    const k = Math.floor(t / 300) % 4;
    r(x - 4, b - 28, 9, 5, '#e2e8f0'); r(x - 1, b - 23, 2, 1, '#e2e8f0');
    for (let d = 0; d < 3; d++) r(x - 2 + d * 2, b - 26, 1, 1, d < k ? '#0b1020' : '#94a3b8');
  }
  // disparo
  s.cool -= dt;
  if (active && bugs.length && s.cool <= 0 && rand() < (t < frenzy ? .25 : .02) * dt) fire(s, t);
}
function fire(s, t) {
  if (!bugs.length) return;
  const target = bugs.reduce((a, bg) => (bg.x < a.x ? bg : a));
  const x1 = s.cx, y1 = FLOOR - 13;
  beams.push({ x1, y1, x2: target.x + 2, y2: target.y + 2, c: s.beam, until: t + 110 });
  boom(target, s.beam);
  bugs = bugs.filter(b => b !== target);
  blocked++; s.cool = t < frenzy ? 4 : 25; sfx.zap(); stats();
}
function boom(bg, c) {
  for (let i = 0; i < 8; i++) sparks.push({ x: bg.x + 2, y: bg.y + 2, vx: (rand() - .5) * 1.4, vy: (rand() - .5) * 1.4, life: 1, c: i % 2 ? c : '#ef4444' });
}
function drawBug(bg, t) {
  const x = bg.x, y = bg.y + Math.round(Math.sin(t / 200 + bg.ph) * 1.5), lg = Math.floor(t / 120 + bg.ph) % 2;
  const body = ['#ef4444', '#f97316', '#e11d48'][bg.kind];
  r(x, y + 1, 5, 3, body); r(x + 1, y, 3, 1, body);
  r(x + 1, y + 1, 1, 1, '#fff'); r(x + 3, y + 1, 1, 1, '#fff');
  r(x - 1, y + (lg ? 1 : 3), 1, 1, body); r(x + 5, y + (lg ? 3 : 1), 1, 1, body);
  r(x + 1, y + 4, 1, 1, '#7f1d1d'); r(x + 3, y + 4, 1, 1, '#7f1d1d');
}

let last = 0;
function frame(t) {
  requestAnimationFrame(frame);
  if (reduce && t - last < 400) return;
  const dt = last ? Math.min(3, (t - last) / 16.7) : 1;
  last = t;
  if (t > nextSpawn) { spawn(rand() < .2 ? 2 : 1); nextSpawn = t + 1300 + rnd(1400); }
  for (const bg of bugs) bg.x += bg.vx * dt;
  const through = bugs.filter(bg => bg.x < RACK_X + 2);
  if (through.length) {
    bugs = bugs.filter(bg => bg.x >= RACK_X + 2);
    breaches += through.length; through.forEach(bg => boom(bg, '#fbbf24'));
    if (t > alarm) sfx.breach();
    alarm = t + 1500; stats();
  }
  scene(t);
  slots.forEach(s => agent(s, t, dt));
  bugs.forEach(bg => drawBug(bg, t));
  beams = beams.filter(bm => bm.until > t);
  beams.forEach(bm => line(bm.x1, bm.y1, bm.x2, bm.y2, bm.c));
  sparks = sparks.filter(p => (p.life -= .035 * dt) > 0);
  sparks.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; r(p.x, p.y, 1, 1, p.c); });
  if (t < alarm && Math.floor(t / 150) % 2) { g.globalAlpha = .12; r(0, 0, W, H, '#ff0000'); g.globalAlpha = 1; }
  card.classList.toggle('alarm', t < alarm);
  if (t < frenzy && Math.floor(t / 450) !== Math.floor((t - 16.7 * dt) / 450)) slots.forEach((s, i) => { s.jump = t + i * 70; });
}
requestAnimationFrame(frame);

// ---------- Panel ----------
const $ = id => document.getElementById(id);
function stats() {
  $('sBlock').textContent = '🛡️ Bloqueados: ' + blocked;
  $('sBreach').textContent = '💥 Brechas: ' + breaches;
  const n = bugs.length, lvl = n > 6 ? 'alto' : n > 2 ? 'medio' : 'bajo';
  $('sLevel').textContent = 'Amenaza: ' + (lvl === 'bajo' ? 'baja' : lvl === 'medio' ? 'media' : 'alta');
  $('sLevel').className = 'pill lvl-' + lvl;
}
setInterval(stats, 500);
const rows = slots.map(s => {
  const row = document.createElement('div');
  row.innerHTML = '<span class="dot"></span><b></b><span class="job"></span>';
  row.querySelector('.dot').style.background = s.shirt;
  row.querySelector('b').textContent = `${s.icon} ${s.name}`;
  $('list').append(row);
  return row;
});
function paint() {
  slots.forEach((s, i) => {
    rows[i].className = 'row' + (s.busy ? ' busy' : '');
    rows[i].lastChild.textContent = s.busy ? s.jobs[s.job] : 'Esperando la próxima alerta…';
  });
}
paint();
setInterval(() => {
  const s = pick(slots);
  if (s.busy && rand() < .3) s.busy = false;
  else { s.busy = true; s.job = (s.job + 1) % s.jobs.length; }
  paint();
}, 2600);

const now = () => performance.now();
cv.addEventListener('click', e => {
  const rect = cv.getBoundingClientRect();
  const px = (e.clientX - rect.left) / rect.width * W;
  const s = slots.reduce((a, b) => Math.abs(b.cx - px) < Math.abs(a.cx - px) ? b : a);
  s.jump = now(); s.busy = true; s.sad = 0; s.job = (s.job + 1) % s.jobs.length; s.cool = 0;
  if (bugs.length) fire(s, now()); else sfx.ok();
  paint();
});
$('counter').onclick = () => { const t = now(); frenzy = t + 3000; slots.forEach((s, i) => { s.busy = true; s.sad = 0; s.cool = 0; s.jump = t + i * 80; }); paint(); sfx.win(); };
$('wave').onclick = () => { const t = now(); spawn(9); alarm = t + 2500; slots.forEach(s => { s.sad = t + 1400; }); sfx.alarm(); stats(); };
$('cheer').onclick = () => { const t = now(); slots.forEach((s, i) => { s.jump = t + i * 80; s.sad = 0; }); sfx.ok(); };
$('snd').onclick = () => { sound = !sound; $('snd').textContent = sound ? '🔊 Sonido: sí' : '🔇 Sonido: no'; };
document.addEventListener('pointerdown', () => audio(), { once: true });
</script>
</body>
</html>
